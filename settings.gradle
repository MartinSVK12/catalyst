pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        maven {
            name = 'Jitpack'
            url = 'https://jitpack.io'
        }
        maven {
            name = 'Babric'
            url = 'https://maven.glass-launcher.net/babric'
        }
    }
}

rootProject.name = 'catalyst'

include 'energy'
include 'fluids'
include 'multiblocks'
include 'effects'
include 'multipart'
include 'all'

include(":btwaila")
project(":btwaila").projectDir = file("${rootProject.projectDir}/../BTWaila")
include(":tmb")
project(":tmb").projectDir = file("${rootProject.projectDir}/../TMB")
